# Release: build the Summoner Select installer on a GitHub-hosted Windows runner
# from a tag of the private code repository, check it, sign a build provenance
# attestation, and publish it here as an immutable release.
#
# Run it from Actions → Release → Run workflow with the code tag (v1.2.3): first
# with "Publish" unticked (build and check only), then ticked.
#
# Needs the repository secret CODE_REPO_TOKEN: a fine-grained personal access
# token for thebrad-hash/summoner-select only, with read-only Contents access.
# Anyone can check a published build: see "Verify this build" in README.md.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Code tag to build (v1.2.3)
        required: true
        type: string
      publish:
        description: Publish the release (unticked = build and check only)
        required: false
        type: boolean
        default: false
      notes:
        description: What's new, for the release notes (optional)
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CODE_REPO: thebrad-hash/summoner-select
  NODE_VERSION: 24.22.1

jobs:
  build:
    name: Build and check
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read       # look up this repository's releases
      id-token: write      # get the short-lived certificate that signs the attestation
      attestations: write  # store the attestation with this repository
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.code.outputs.version }}
      commit: ${{ steps.code.outputs.commit }}
      setup: ${{ steps.code.outputs.setup }}
      inno: ${{ steps.inno.outputs.version }}
      data: ${{ steps.smoke.outputs.data }}
      attestation: ${{ steps.attest.outputs.attestation-url }}
    steps:
      - name: Check the inputs
        env:
          TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
          HAS_TOKEN: ${{ secrets.CODE_REPO_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:TAG -cnotmatch '^v\d+\.\d+\.\d+$') { throw "The tag must look like v1.2.3, not '$env:TAG'." }
          if ($env:HAS_TOKEN -ne 'true') { throw 'The repository secret CODE_REPO_TOKEN is missing (see the top of release.yml).' }
          if ($env:PUBLISH -eq 'true') {
            $null = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>&1
            if ($LASTEXITCODE -eq 0) { throw "$env:GITHUB_REPOSITORY already has a release $env:TAG." }
          }
          exit 0

      - name: Get Node ${{ env.NODE_VERSION }} x64 from nodejs.org, checked against its SHASUMS256.txt
        run: |
          $name = "node-v$env:NODE_VERSION-win-x64"
          $base = "https://nodejs.org/dist/v$env:NODE_VERSION"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "$base/$name.zip" -OutFile $zip
          $line = ([string](Invoke-RestMethod "$base/SHASUMS256.txt")) -split "`n" |
            Where-Object { $_.Trim() -match "^[0-9a-f]{64}\s+$([regex]::Escape("$name.zip"))$" } | Select-Object -First 1
          if (-not $line) { throw "$name.zip is not listed in SHASUMS256.txt." }
          $expected = $line.Trim().Substring(0, 64)
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "$name.zip does not match SHASUMS256.txt ($actual, expected $expected)." }
          & "$env:WINDIR\System32\tar.exe" -xf $zip -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "Could not unpack $name.zip." }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP $name)
          "$name.zip sha256 $actual matches nodejs.org's SHASUMS256.txt"

      - name: Keep line endings exactly as committed
        run: git config --global core.autocrlf false

      - name: Check out ${{ env.CODE_REPO }} at ${{ inputs.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CODE_REPO }}
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.CODE_REPO_TOKEN }}
          persist-credentials: false
          path: code

      - name: Read the version
        id: code
        working-directory: code
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $node = node -p "process.version + ' ' + process.arch"
          if ($node -ne "v$env:NODE_VERSION x64") { throw "Expected Node v$env:NODE_VERSION x64, got $node." }
          $version = node -p "require('./package.json').version"
          if ("v$version" -cne $env:TAG) { throw "package.json at $env:TAG says version $version." }
          $commit = git rev-parse HEAD
          Add-Content $env:GITHUB_OUTPUT "version=$version", "commit=$commit", "setup=SummonerSelect-$version-setup.exe"
          "Summoner Select $version, commit $commit, Node $node"

      - name: Find Inno Setup
        id: inno
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe" |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 6 is not installed on this runner image.' }
          $entry = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like 'Inno Setup*' } | Select-Object -First 1
          $version = if ($entry.DisplayVersion) { $entry.DisplayVersion } else { 'unknown version' }
          Add-Content $env:GITHUB_OUTPUT "iscc=$iscc", "version=$version"
          "Inno Setup $version at $iscc"

      - name: Run the tests
        working-directory: code
        run: node test/run.mjs

      - name: Build the installer
        working-directory: code
        env:
          ISCC: ${{ steps.inno.outputs.iscc }}
        run: node tools/package.mjs --iscc $env:ISCC

      - name: Install it on this runner and start it
        id: smoke
        env:
          SETUP: code/dist/${{ steps.code.outputs.setup }}
          VERSION: ${{ steps.code.outputs.version }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'installed'
          $install = Start-Process -FilePath (Resolve-Path $env:SETUP).Path -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$dir`"" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "The installer exited with code $($install.ExitCode)." }
          foreach ($file in 'Summoner Select.exe', 'unins000.exe', 'runtime\node.exe', 'app\src\server.js', 'app\vendor\braddraft\public\engine\index.js', 'app\vendor\braddraft\public\data\bundle.json') {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "The install has no $file." }
          }
          # run the installed app in demo mode, as its launcher would, and ask it about itself
          $server = Join-Path $dir 'app\src\server.js'
          $dataDir = Join-Path $env:RUNNER_TEMP 'smoke-data'
          $log = Join-Path $env:RUNNER_TEMP 'smoke.log'
          $app = Start-Process -FilePath (Join-Path $dir 'runtime\node.exe') -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err" `
            -ArgumentList "`"$server`"", '--mock', '--no-open', '--no-data-update', '--port', '18787', '--data-dir', "`"$dataDir`""
          try {
            $info = $null
            for ($i = 0; $i -lt 60 -and -not $info.engine.ok; $i++) {
              Start-Sleep -Seconds 1
              try { $info = Invoke-RestMethod 'http://127.0.0.1:18787/api/diagnostics' } catch { }
            }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
          Get-Content $log, "$log.err" -ErrorAction SilentlyContinue
          if (-not $info) { throw 'The installed app did not answer.' }
          if ($info.version -ne $env:VERSION) { throw "The installed app says it is version $($info.version)." }
          if ($info.engine.source -ne 'embedded' -or -not $info.engine.ok) { throw "The draft engine did not load: $($info.engine | ConvertTo-Json -Compress)" }
          $built = $info.engine.data.builtAt
          $built = if ($built -is [datetime]) { $built.ToUniversalTime().ToString('yyyy-MM-dd') } else { ([string]$built).Substring(0, 10) }
          $data = 'patch {0}, built {1}, {2:N0} games' -f $info.engine.dataPatch, $built, $info.engine.games
          Add-Content $env:GITHUB_OUTPUT "data=$data"
          "The installed $env:VERSION starts and loads its draft engine ($data)."

      - name: Sign the build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: code/dist/${{ steps.code.outputs.setup }}

      - name: Hand the installer to the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: |
            code/dist/${{ steps.code.outputs.setup }}
            code/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # create the tag and the release
    steps:
      - name: Get the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: release

      - name: Publish ${{ inputs.tag }}
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          SETUP: ${{ needs.build.outputs.setup }}
          INNO: ${{ needs.build.outputs.inno }}
          DATA: ${{ needs.build.outputs.data }}
          ATTESTATION: ${{ needs.build.outputs.attestation }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          sha256sum -c SHA256SUMS.txt
          sum=$(cut -d' ' -f1 SHA256SUMS.txt)
          {
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            echo "Built by GitHub Actions on a GitHub-hosted Windows runner ([build log]($RUN_URL)) from tag \`$TAG\` of the private code repository, commit \`$COMMIT\`. Not code-signed yet."
            echo
            echo "- \`$SETUP\` SHA-256: \`$sum\`"
            echo "- Build provenance: [attestation]($ATTESTATION)"
            echo "- Node $NODE_VERSION (official nodejs.org build, hash checked), Inno Setup $INNO"
            echo "- Draft data: $DATA"
            echo
            echo "To check this build yourself, see [Verify this build]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY#verify-this-build)."
          } > notes.md
          gh release create "$TAG" "$SETUP" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Summoner Select $VERSION" --notes-file notes.md --latest

  verify:
    name: Verify the release from a clean download
    needs: [build, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      SETUP: ${{ needs.build.outputs.setup }}
    steps:
      - name: Download the release
        run: |
          mkdir clean && cd clean
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          ls -l
          sha256sum -c SHA256SUMS.txt

      - name: Check the build provenance
        working-directory: clean
        run: |
          gh attestation verify "$SETUP" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main --deny-self-hosted-runners

      - name: Check the release attestation
        working-directory: clean
        run: |
          for try in 1 2 3 4 5 6; do
            gh release verify "$TAG" --repo "$GITHUB_REPOSITORY" && break
            [ "$try" = 6 ] && exit 1
            sleep 10
          done
          gh release verify-asset "$TAG" "$SETUP" --repo "$GITHUB_REPOSITORY"
